name: Deploy ASP.NET Framework to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - run: nuget restore DemoAspNetFramework.sln

      - run: msbuild DemoAspNetFramework.sln /p:Configuration=Release

      - name: Package website
        run: |
          msbuild DemoAspNetFramework\DemoAspNetFramework.csproj `
          /p:Configuration=Release `
          /p:DeployOnBuild=true `
          /p:WebPublishMethod=Package `
          /p:PackageAsSingleFile=true

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: demo-aspnet-framework
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: DemoAspNetFramework/obj/Release/Package/DemoAspNetFramework.zip