name: Deploy ASP.NET Framework to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:

    - uses: actions/checkout@v4

    - uses: microsoft/setup-msbuild@v2

    - uses: NuGet/setup-nuget@v2

    - name: Restore packages
      run: nuget restore DemoAspNetFramework.sln

    - name: Build
      run: msbuild DemoAspNetFramework.sln /p:Configuration=Release

    - name: Publish website files
      run: |
        msbuild DemoAspNetFramework\DemoAspNetFramework.csproj `
        /p:Configuration=Release `
        /p:DeployOnBuild=true `
        /p:WebPublishMethod=FileSystem `
        /p:PublishUrl="${{ github.workspace }}\site"

    - name: Verify publish output
      run: dir "${{ github.workspace }}\site"

    - name: Deploy to Azure
      uses: azure/webapps-deploy@v3
      with:
        app-name: demo-aspnet-framework
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: '${{ github.workspace }}\site'