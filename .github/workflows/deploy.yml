name: Deploy ASP.NET Framework to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore packages
      run: nuget restore DemoAspNetFramework.sln

    - name: Build solution
      run: msbuild DemoAspNetFramework.sln /p:Configuration=Release

    - name: Publish package
      run: |
        msbuild DemoAspNetFramework.sln `
        /p:DeployOnBuild=true `
        /p:WebPublishMethod=Package `
        /p:PackageAsSingleFile=true `
        /p:SkipInvalidConfigurations=true `
        /p:PackageLocation="${{ github.workspace }}\publish"

    - name: Deploy to Azure
      uses: azure/webapps-deploy@v3
      with:
        app-name: demo-aspnet-framework
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: publish